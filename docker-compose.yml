version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Kairos2026!}
      POSTGRES_DB: kairosdigital
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kairos_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairosdigital"]
      interval: 10s
      timeout: 5s
      retries: 5

  crm-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kairos:***@postgres:5432/kairosdigital
      NODE_ENV: production
      PORT: 3001
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evogo-api:8080}
      EVOLUTION_GLOBAL_KEY: ${EVOLUTION_GLOBAL_KEY}
      JWT_SECRET: ${JWT_SECRET}
      BRIDGE_URL: ${BRIDGE_URL:-http://hermes-evolution-bridge:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kairos_net
      - hermes_net
      - evogo_net
    ports:
      - "3001:3001"

  crm-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.seudominio.com}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.seudominio.com}
    depends_on:
      - crm-api
    networks:
      - kairos_net
    ports:
      - "3000:3000"

  # Bridge Hermes ↔ Evolution (já roda no seu VPS, incluído para referência)
  # hermes-evolution-bridge:
  #   build:
  #     context: ./bridge
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   environment:
  #     PORT: 3000
  #     HERMES_API_URL: ${HERMES_API_URL:-http://hermes-workspace-hermes-agent-1:8642}
  #     HERMES_API_KEY: ${HERMES_API_KEY}
  #     EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evogo-api:8080}
  #     EVOLUTION_GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_KEY}
  #     ADMIN_KEY: ${ADMIN_KEY}
  #   networks:
  #     - hermes_net
  #     - evogo_net
  #   ports:
  #     - "3000:3000"

volumes:
  postgres_data:

networks:
  kairos_net:
    driver: bridge
  hermes_net:
    external: true
    name: hermes-workspace_default
  evogo_net:
    external: true
    name: evogo_evogo-network